{% extends 'Main/base_simple.html' %}

{% block titulo %}
    Crear Publicacion
{% endblock titulo %}

{% block contenido_titulo %}
    Publicar
{% endblock contenido_titulo %}

{% block contenido %}
    <form method="post">
        {% csrf_token %}
        <table>
            {{form.as_table}}
        </table>
        <input type="submit" value="Enviar">
        <a href="{% url 'blog:lista_publicacion' %}">Cancelar</a>
    </form>
{% endblock contenido %}
